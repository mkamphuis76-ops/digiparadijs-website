<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0E3B43;font-family:"Plus Jakarta Sans",sans-serif;color:#F7F5F0;position:relative}
.sun{position:absolute;right:-150px;top:40px;width:540px;aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,#FFC98A,#FFB36B 45%,#FF7A59);
-webkit-mask:linear-gradient(#000 0 50%,transparent 50% 56%,#000 56% 66%,transparent 66% 72%,#000 72% 82%,transparent 82% 88%,#000 88%)}
.bird{position:absolute;right:110px;top:120px;width:180px;filter:brightness(0) invert(1);opacity:.95;rotate:-6deg}
.logo{position:absolute;left:72px;top:64px;height:52px}
h1{position:absolute;left:72px;top:168px;margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:60px;line-height:1.08;letter-spacing:-.02em;width:740px}
h1 span{color:#FFB36B;position:relative;display:inline-block;white-space:nowrap}
h1 span::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.12em;background:#FF7A59;border-radius:4px;z-index:-1}
.row{position:absolute;left:72px;bottom:64px;display:flex;gap:14px;align-items:center}
.chip{background:#FF7A59;color:#0E3B43;font-weight:800;font-size:26px;padding:14px 24px;border-radius:4px}
.txt{font-size:26px;font-weight:700;color:#CFE3E0}
.url{position:absolute;right:72px;bottom:72px;font-size:24px;font-weight:800;color:#9FDCD7}
</style></head><body>
<div class="sun"></div><img class="bird" src="img/logo/digi-paradijs-beeldmerk-kleur.svg" alt="">
<img class="logo" src="img/logo/digi-paradijs-horizontaal-wit.svg" alt="">
<h1>Jouw bedrijf online. <span>Duidelijk geregeld.</span></h1>
<div class="row"><span class="chip">Vanaf € 199</span><span class="txt">Websites voor kleine ondernemers</span></div>
</body></html>
