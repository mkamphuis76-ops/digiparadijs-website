<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden · Digi Paradijs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#F7F5F0;color:#102A2F;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:17px;line-height:1.6}
header{padding:18px max(18px,4vw)}
header img{height:38px;width:auto;display:block}
main{flex:1;display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,64px);align-items:center;max-width:1000px;margin:0 auto;padding:24px max(18px,4vw) 64px}
main img{width:clamp(200px,30vw,320px);height:auto}
.code{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0B7B78;font-size:.82rem}
h1{font-family:Unbounded,"Arial Black",sans-serif;font-weight:800;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.05;letter-spacing:-.02em;margin:10px 0 16px}
p{margin:0 0 24px;color:#55686A;max-width:46ch}
.btns{display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;padding:14px 24px;border-radius:4px;text-decoration:none;border:2px solid transparent}
a.btn.hot{background:#FF7A59;color:#0E3B43}a.btn.hot:hover{background:#FF6A45}
a.btn.line{border-color:#102A2F;color:#102A2F}a.btn.line:hover{background:#102A2F;color:#F7F5F0}
a:focus-visible{outline:3px solid #FF7A59;outline-offset:3px}
@media (max-width:640px){main{grid-template-columns:1fr;text-align:left}main img{width:200px}}
</style>
</head>
<body>
<header><a href="/" aria-label="Naar de homepage van Digi Paradijs"><img src="/img/logo/digi-paradijs-horizontaal-kleur.svg" alt="Digi Paradijs" width="167" height="35"></a></header>
<main>
  <img src="/img/michel-oeps.webp" alt="Getekende Michel slaat verbaasd zijn handen voor zijn mond" width="434" height="520">
  <div>
    <span class="code">Fout 404</span>
    <h1>Oeps, deze pagina bestaat niet</h1>
    <p>Misschien is de link oud of zit er een typfout in het adres. Geen zorgen: vanaf de homepage vind je alles terug.</p>
    <div class="btns">
      <a class="btn hot" href="/">Naar de homepage <span aria-hidden="true">→</span></a>
      <a class="btn line" href="/#contact">Stel je vraag</a>
    </div>
  </div>
</main>
</body>
</html>
